name: Publish Ultron v1.7.3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: contains(github.event.head_commit.message, '[release v1.7.3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release package
        run: |
          unzip -t Ultron_v1.7.3.zip
          sha256sum Ultron_v1.7.3.zip | tee Ultron_v1.7.3.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.7.3 >/dev/null 2>&1 || \
            gh release create v1.7.3 \
              Ultron_v1.7.3.zip \
              Ultron_v1.7.3.zip.sha256 \
              --title "Ultron v1.7.3" \
              --notes-file RELEASE_NOTES.md \
              --latest
