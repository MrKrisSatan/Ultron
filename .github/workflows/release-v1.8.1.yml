name: Publish Ultron v1.8.1
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: contains(github.event.head_commit.message, '[release v1.8.1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release package
        run: |
          unzip -t Ultron_v1.8.1.zip
          sha256sum Ultron_v1.8.1.zip | tee Ultron_v1.8.1.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.8.1 >/dev/null 2>&1 || \
            gh release create v1.8.1 \
              Ultron_v1.8.1.zip \
              Ultron_v1.8.1.zip.sha256 \
              --title "Ultron v1.8.1" \
              --notes-file RELEASE_NOTES.md \
              --latest
